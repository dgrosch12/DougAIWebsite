<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DouglasAI Business Card</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    background: #0f0f1a;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    gap: 48px;
    padding: 60px 40px;
  }
  h2 {
    color: #555;
    font-weight: 500;
    font-size: 12px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .label {
    color: #444;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    text-align: center;
  }
  .card-pair {
    display: flex;
    gap: 48px;
    align-items: start;
  }
  .card-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  /* Card base — standard 3.5 x 2 in */
  .card {
    width: 3.5in;
    height: 2in;
    border-radius: 10px;
    position: relative;
    overflow: hidden;
    box-shadow:
      0 25px 50px rgba(0,0,0,0.5),
      0 0 0 1px rgba(255,255,255,0.04);
  }

  /* ========== FRONT ========== */
  .front {
    background: #172B36;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 26px 28px 22px;
  }

  /* Network pattern canvas */
  .front canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0.6;
  }

  .front-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    z-index: 1;
  }
  .logo-block {}
  .logo {
    font-size: 20px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.5px;
    line-height: 1;
  }
  .logo span {
    background: linear-gradient(135deg, #1A8A9E, #2A7DE1);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .person-name {
    font-size: 11px;
    font-weight: 600;
    color: rgba(255,255,255,0.8);
    margin-top: 4px;
  }
  .person-title {
    font-size: 7.5px;
    font-weight: 600;
    background: linear-gradient(135deg, #1A8A9E, #2A7DE1);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    margin-top: 1px;
  }

  .front-bottom {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    z-index: 1;
  }
  .contact-col {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .c-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .c-icon {
    width: 10px;
    height: 10px;
    color: rgba(26,138,158,0.7);
    flex-shrink: 0;
  }
  .c-text {
    font-size: 7.5px;
    color: rgba(255,255,255,0.5);
    font-weight: 500;
  }
  .tagline {
    font-size: 7px;
    color: rgba(255,255,255,0.2);
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    text-align: right;
    line-height: 1.4;
    max-width: 100px;
  }

  /* gradient accent bar */
  .bar {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, #1A8A9E, #2A7DE1);
  }

  /* ========== BACK ========== */
  .back {
    background: #172B36;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .back canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    opacity: 0.35;
  }
  .back-content {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    z-index: 1;
  }
  .qr-box {
    width: 96px;
    height: 96px;
    background: #fff;
    border-radius: 10px;
    padding: 7px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  .qr-box img {
    width: 100%;
    height: 100%;
    display: block;
    border-radius: 4px;
  }
  .qr-url {
    font-size: 8px;
    font-weight: 600;
    color: rgba(255,255,255,0.3);
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .back .bar { top: 0; bottom: auto; }
</style>
</head>
<body>

<h2>DouglasAI &mdash; Business Card</h2>

<div class="card-pair">

  <!-- FRONT -->
  <div class="card-wrap">
    <div class="label">Front</div>
    <div class="card front" id="cardFront">
      <canvas id="netFront"></canvas>

      <div class="front-top">
        <div class="logo-block">
          <div class="logo">Douglas<span>AI</span></div>
          <div class="person-name">Douglas Grosch</div>
          <div class="person-title">Founder &amp; AI Solutions Architect</div>
        </div>
      </div>

      <div class="front-bottom">
        <div class="contact-col">
          <div class="c-row">
            <svg class="c-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 4L12 13 2 4"/></svg>
            <span class="c-text">dgrosch12@gmail.com</span>
          </div>
          <div class="c-row">
            <svg class="c-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg>
            <span class="c-text">(908) 295-7881</span>
          </div>
          <div class="c-row">
            <svg class="c-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>
            <span class="c-text">douglasai.co</span>
          </div>
          <div class="c-row">
            <svg class="c-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/><circle cx="12" cy="10" r="3"/></svg>
            <span class="c-text">Whitehouse, NJ</span>
          </div>
        </div>
        <div class="tagline">AI Automation<br>That Delivers ROI</div>
      </div>

      <div class="bar"></div>
    </div>
  </div>

  <!-- BACK -->
  <div class="card-wrap">
    <div class="label">Back</div>
    <div class="card back" id="cardBack">
      <canvas id="netBack"></canvas>
      <div class="back-content">
        <div class="qr-box">
          <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://douglasai.co&color=172B36&bgcolor=FFFFFF&margin=0" alt="Scan to visit douglasai.co">
        </div>
        <div class="qr-url">douglasai.co</div>
      </div>
      <div class="bar"></div>
    </div>
  </div>

</div>

<script>
// Static network constellation pattern — matches the website's DotGrid
function drawNetwork(canvasId, seed) {
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext('2d');
  const rect = canvas.parentElement.getBoundingClientRect();
  const dpr = 2;
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const W = rect.width;
  const H = rect.height;

  // Seeded random
  let s = seed;
  function rand() { s = (s * 16807 + 0) % 2147483647; return s / 2147483647; }

  // Generate nodes
  const nodes = [];
  const count = 40;
  for (let i = 0; i < count; i++) {
    nodes.push({ x: rand() * W, y: rand() * H, r: rand() * 1.2 + 1 });
  }

  const CONN_DIST = 80;

  // Draw connections
  ctx.lineWidth = 0.8;
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const dx = nodes[i].x - nodes[j].x;
      const dy = nodes[i].y - nodes[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < CONN_DIST) {
        const alpha = (1 - dist / CONN_DIST) * 0.25;
        ctx.beginPath();
        ctx.moveTo(nodes[i].x, nodes[i].y);
        ctx.lineTo(nodes[j].x, nodes[j].y);
        ctx.strokeStyle = `rgba(26, 138, 158, ${alpha})`;
        ctx.stroke();
      }
    }
  }

  // Draw nodes
  for (const n of nodes) {
    // Glow
    const grad = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.r * 4);
    grad.addColorStop(0, 'rgba(42, 125, 225, 0.15)');
    grad.addColorStop(1, 'rgba(42, 125, 225, 0)');
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.r * 4, 0, Math.PI * 2);
    ctx.fillStyle = grad;
    ctx.fill();

    // Dot
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(26, 138, 158, 0.5)';
    ctx.fill();
  }
}

drawNetwork('netFront', 42);
drawNetwork('netBack', 137);
</script>

</body>
</html>
